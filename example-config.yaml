server:
    bind:
        host: 0.0.0.0
        port: 5000
    url: https://edr-api-c.mdl.nws.noaa.gov/ra-iv
    mimetype: application/json; charset=UTF-8
    encoding: utf-8
    gzip: false
    languages:
        # First language is the default language
        - en-US
        - fr-CA
    # cors: true
    pretty_print: true
    limits:
        default_items: 20
        max_items: 50
    # templates:
      # path: /path/to/Jinja2/templates
      # static: /path/to/static/folder # css/js/img
    map:
        url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
        attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap contributors</a>'
#    manager:
#        name: TinyDB
#        connection: /tmp/pygeoapi-process-manager.db
#        output_dir: /tmp/
    # ogc_schemas_location: /opt/schemas.opengis.net
    admin: false # enable admin api

logging:
    level: ERROR
    #logfile: /tmp/pygeoapi.log

metadata:
    identification:
        title:
            en: pygeoapi default instance
            fr: instance par défaut de pygeoapi
        description:
            en: pygeoapi provides an API to geospatial data
            fr: pygeoapi fournit une API aux données géospatiales
        keywords:
            en:
                - geospatial
                - data
                - api
            fr:
                - géospatiale
                - données
                - api
        keywords_type: theme
        terms_of_service: https://creativecommons.org/licenses/by/4.0/
        url: https://example.org
    license:
        name: CC-BY 4.0 license
        url: https://creativecommons.org/licenses/by/4.0/
    provider:
        name: Organization Name
        url: https://pygeoapi.io
    contact:
        name: Lastname, Firstname
        position: Position Title
        address: Mailing Address
        city: City
        stateorprovince: Administrative Area
        postalcode: Zip or Postal Code
        country: Country
        phone: +xx-xxx-xxx-xxxx
        fax: +xx-xxx-xxx-xxxx
        email: you@example.org
        url: Contact URL
        hours: Mo-Fr 08:00-17:00
        instructions: During hours of service. Off on weekends.
        role: pointOfContact

resources:

    rmtn-all-text-minute:
        type: collection
        title: 'RA-IV RMTN: All Text, One File per Minute'
        description: 'Text bulletins in the ALL_TEXT_MINUTE folder of the RA-IV GIFS RMTN data. Files are named DDHHMM_RMTN (UTC day, hour and minute), for example 161625_RMTN.'
        keywords:
            - National Weather Service
            - RA-IV
            - RMTN
            - text bulletins
        extents:
            spatial:
                bbox: [-180, -90, 180, 90]
                crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
        links:
            - type: text/html
              rel: related
              title: RA4-GIFS directory listing
              href: https://ra4-gifs.weather.gov/data/RMTN/ALL_TEXT_MINUTE/
        providers:
            - type: feature
              name: pygeoapi.provider.file_listing.FileListingProvider
              data: https://ra4-gifs.weather.gov/data/RMTN/ALL_TEXT_MINUTE/
              id_field: id
              time_field: reference_time
              options:
                  media_type: text/plain

    rmtn-all-text-hourly:
        type: collection
        title: 'RA-IV RMTN: All Text, One File per Hour'
        description: 'Text bulletins in the ALL_TEXT_HOURLY folder of the RA-IV GIFS RMTN data. Files are named RMTN_TEXT_HOURLY_DDHH00 (UTC day and hour), for example RMTN_TEXT_HOURLY_151800.'
        keywords:
            - National Weather Service
            - RA-IV
            - RMTN
            - text bulletins
        extents:
            spatial:
